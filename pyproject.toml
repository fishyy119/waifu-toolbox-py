[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["waifu_toolbox*"]
namespaces = false

[project]
name = "waifu-toolbox"
version = "0.5.2"
description = "CLI toolbox for building image repositories, classifying anime characters, sorting images, and converting formats."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "dghs-imgutils==0.19.0",
    "dreamsim==0.2.1",         # 相似度特征计算
    "onnxruntime==1.20.0",     # gpu运行报错可尝试锁定该版本
    "umap-learn==0.5.9.post2", # 用于降维排序
    "rich>=14,<15",
]

[project.optional-dependencies]
gui = ["nicegui>=2.0,<3", "pydantic>=2,<3"]

[dependency-groups]
dev = ["line-profiler>=5.0,<6", "pytest>=9.0,<10", "pyright>=1.1,<2"]

[project.scripts]
waifu = "waifu_toolbox.cli:main"
waifu-gui = "waifu_toolbox.gui:main"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
strict = true
markers = [
    "integration: exercises filesystem and sqlite-backed workflows",
    "slow: relies on heavier optional dependencies or longer-running flows",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/waifu_toolbox", "tests"]
reportUnusedImport = "warning"
stubPath = "./typings"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
known_first_party = ["waifu_toolbox"]
