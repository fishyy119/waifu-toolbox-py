[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["waifu_toolbox*"]
namespaces = false

[project]
name = "waifu-toolbox"
version = "0.6.0"
description = "CLI toolbox for building image repositories, classifying anime characters, sorting images, and converting formats."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "dghs-imgutils==0.19.0",
    "dreamsim==0.2.1",         # 相似度特征计算
    "onnxruntime==1.20.0",     # gpu运行报错可尝试锁定该版本
    "umap-learn==0.5.9.post2", # 用于降维排序
    "rich>=14,<15",
]

[project.optional-dependencies]
gui = ["nicegui>=3.14.0,<4", "pydantic>=2,<3", "pyicu-wheels>=2.15.2,<2.16"]

[dependency-groups]
dev = [
    "line-profiler>=5.0,<6",
    "pytest>=9.0,<10",
    "pyright>=1.1,<2",
    "ruff>=0.15.22,<1",
]

[project.scripts]
waifu = "waifu_toolbox.cli:main"
waifu-gui = "waifu_toolbox.gui:main"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
strict = true
markers = [
    "integration: exercises filesystem and sqlite-backed workflows",
    "slow: relies on heavier optional dependencies or longer-running flows",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/waifu_toolbox", "tests"]
reportUnusedImport = "warning"
stubPath = "./typings"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle（原 flake8）
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",
    "RUF",
    "SIM",
    "C4",
    "TC",
]

ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "B"]
"src/waifu_toolbox/gui/**/*.py" = ["SIM117"] # with 嵌套

[tool.ruff.lint.isort]
known-first-party = ["waifu_toolbox"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
