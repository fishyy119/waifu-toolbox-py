name: check

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m pip install --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Lefthook
        run: pnpm hooks:validate
      - name: Frontend format
        run: pnpm --filter piperch-frontend format:check
      - name: Frontend lint
        run: pnpm --filter piperch-frontend lint
      - name: Frontend typecheck
        run: pnpm --filter piperch-frontend typecheck
      - name: Frontend tests
        run: pnpm --filter piperch-frontend test:unit
      - name: Frontend build
        run: pnpm --filter piperch-frontend build:bundle
